services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dierb}
      POSTGRES_USER: ${POSTGRES_USER:-dierb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck: {test: [CMD, redis-cli, -a, "${REDIS_PASSWORD}", ping], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"}
    volumes: [minio_data:/data]
    networks: [data]
    healthcheck: {test: [CMD, mc, ready, local], interval: 15s, timeout: 5s, retries: 10}
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dierb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dierb}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: ${MINIO_BUCKET:-dierb-uploads}
    networks: [edge, data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck: {test: [CMD, curl, -fsS, http://localhost:3000/v1/health], interval: 15s, timeout: 5s, retries: 10}
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/dierb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [edge]
    depends_on: {backend: {condition: service_healthy}}
    restart: unless-stopped
networks: {edge: {}, data: {internal: true}}
volumes: {postgres_data: {}, redis_data: {}, minio_data: {}}
