name: Dierb Backend CI
on:
  workflow_dispatch:
  push:
    branches: [dierb-self-hosted-backend]
    paths: ["backend/**", "docker-compose.yml", "deploy/**", "scripts/**", ".github/workflows/backend-ci.yml"]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: dierb, POSTGRES_PASSWORD: ci-password, POSTGRES_DB: dierb_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dierb -d dierb_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    defaults: {run: {working-directory: backend}}
    env:
      DATABASE_URL: postgresql://dierb:ci-password@localhost:5432/dierb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-characters
      CORS_ORIGINS: http://localhost:8080
      PUBLIC_API_URL: http://localhost:3000
      UPLOAD_ROOT: /tmp/dierb-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: backend/package.json}
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Generate and apply clean initial migration
        run: |
          mkdir -p prisma/migrations/0001_init
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0001_init/migration.sql
          npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: npm run prisma:seed
      - name: Upload generated initial migration
        uses: actions/upload-artifact@v4
        with: {name: Dierb-Initial-PostgreSQL-Migration, path: backend/prisma/migrations/0001_init/migration.sql, retention-days: 30}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env config >/dev/null
      - run: docker build -t dierb-backend:ci backend
