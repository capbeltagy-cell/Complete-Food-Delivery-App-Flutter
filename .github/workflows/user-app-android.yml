name: Build Dierb Android

on:
  workflow_dispatch:
  push:
    branches:
      - dierb-super-app
    paths:
      - ".github/workflows/user-app-android.yml"
      - "user_app/**"
      - "packages/dierb_core/**"

permissions:
  contents: read

concurrency:
  group: dierb-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: User app APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: user_app

    steps:
      - name: Checkout dierb-super-app
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dierb-${{ hashFiles('user_app/pubspec.lock', 'user_app/android/gradle/wrapper/gradle-wrapper.properties', 'user_app/android/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-dierb-

      - name: Verify Firebase Android target
        run: |
          test -f android/app/google-services.json
          grep -q '"project_id": "dierb-29548"' android/app/google-services.json
          grep -q '"package_name": "com.capbeltagy.dierb"' android/app/google-services.json

      - name: Configure optional Play upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dierb-upload-key.jks
            {
              echo "storePassword=$ANDROID_STORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/user_app/android/app/dierb-upload-key.jks"
            } > android/key.properties
            echo "release_signing=upload" >> "$GITHUB_ENV"
          else
            echo "release_signing=debug-fallback" >> "$GITHUB_ENV"
            echo "Upload keystore not configured; producing testable debug-signed release artifacts."
          fi

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze user app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Stage Android artifacts
        run: |
          mkdir -p build/ci-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk build/ci-artifacts/Dierb-release.apk
          cp build/app/outputs/bundle/release/app-release.aab build/ci-artifacts/Dierb-release.aab
          printf 'Signing mode: %s\nCommit: %s\n' "$release_signing" "$GITHUB_SHA" > build/ci-artifacts/build-info.txt

      - name: Upload Dierb APK
        uses: actions/upload-artifact@v4
        with:
          name: Dierb-APK
          path: user_app/build/ci-artifacts/Dierb-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dierb AAB
        uses: actions/upload-artifact@v4
        with:
          name: Dierb-AAB
          path: |
            user_app/build/ci-artifacts/Dierb-release.aab
            user_app/build/ci-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        run: rm -f android/key.properties android/app/dierb-upload-key.jks
